# مستودع البيانات المفتوحة لنبض البيانات: جمع الملفات الخام كما تنشرها الهيئة العامة للإحصاء.
# نُقل من المستودع الخاص في 9 أكتوبر 2026 بقرار المالك (دقائق Actions مجانية للمستودعات العامة).
# لا كود موقع ولا أسرار هنا. المستودع الخاص يزامن هذه الملفات كل ليلة ويوحّدها هناك.
name: collect-gastat-pub
on:
  schedule:
    - cron: '7 4 * * *'   # يوميًا 07:07 الرياض
  workflow_dispatch:
    inputs:
      mode:
        description: 'update | backfill | discover'
        default: 'backfill'
        type: choice
        options: [update, backfill, discover]
      priority:
        description: 'backfill: أعلى أولوية تُسحب (1 = منتجاتنا أولًا، 3 = الكل)'
        default: '1'
        type: choice
        options: ['1', '2', '3']
      max_minutes:
        description: 'backfill: سقف الوقت بالدقائق (أقل من 300)'
        default: '280'
      max_mb:
        description: 'backfill: سقف حجم التنزيل بالميغابايت لكل تشغيل'
        default: '700'
permissions:
  contents: write
concurrency:
  group: gastat-open
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas openpyxl xlrd hijri-converter
      - name: collect
        env:
          MODE: ${{ github.event.inputs.mode || 'update' }}
          PRIO: ${{ github.event.inputs.priority || '1' }}
          MAXMIN: ${{ github.event.inputs.max_minutes || '280' }}
          MAXMB: ${{ github.event.inputs.max_mb || '700' }}
        run: |
          set -o pipefail
          case "$MODE" in
            update)   python3 scripts/collect_gastat_pub.py --mode update ;;
            discover) python3 scripts/collect_gastat_pub.py --mode discover ;;
            backfill) python3 scripts/collect_gastat_pub.py --mode backfill --priority "$PRIO" --max-minutes "$MAXMIN" --max-mb "$MAXMB" --resume ;;
          esac 2>&1 | tee /tmp/gastat_pub.log
      - name: commit
        if: always()
        run: |
          git config user.name "marqab-data"; git config user.email "cc@datapulseactive.com"
          find raw/history/gastat_pub -name '*.part' -delete || true
          git add raw/history data
          if git diff --cached --quiet; then echo "no new data"; exit 0; fi
          N=$(git diff --cached --name-only -- raw/history/gastat_pub | grep -v published_on.csv | wc -l)
          git commit -m "بيانات: إصدارات الهيئة ${{ github.event.inputs.mode || 'update' }} $(date -u +%F) — ${N} ملف [skip deploy]"
          git pull --no-edit origin main && git push origin main
